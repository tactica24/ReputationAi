<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form - ReputationAI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Shared Premium Navigation Header -->
    <!--#include file="shared-header.html" -->
    <main>
        <section class="application-form-section">
            <h1>Get Protected: Application Form</h1>
            <form class="application-form">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
                <label for="company">Company (optional):</label>
                <input type="text" id="company" name="company">
                <label for="details">Protection Needs:</label>
                <textarea id="details" name="details" rows="4" required></textarea>
                <button type="submit" class="btn-hero-primary">Submit Application</button>
            </form>
        </section>
    </main>
</body>
</html>
