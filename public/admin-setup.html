<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReputationAI - Admin Setup</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-size: 14px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #333;
            line-height: 1.6;
        }

        .info-box strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🔐 Admin Setup</h1>
            <p>ReputationAI - Login & Make Admin</p>
        </div>

        <!-- LOGIN SECTION -->
        <div id="loginSection">
            <div class="info-box">
                <strong>Step 1 - Login:</strong><br>
                Sign in with your email and password first.
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email *</label>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        placeholder="okwafa@gmail.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password *</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        placeholder="Your password"
                        required
                    >
                </div>

                <button type="submit" id="loginBtn">
                    Login
                </button>

                <div class="loading" id="loginLoading">
                    <div class="spinner"></div>
                    <p>Logging in...</p>
                </div>

                <div class="status" id="loginStatus"></div>
            </form>
        </div>

        <!-- ADMIN SECTION (Hidden until logged in) -->
        <div id="adminSection" style="display: none;">
            <div class="info-box">
                <strong>Step 2 - Make Admin:</strong><br>
                You're logged in as: <strong id="currentUser"></strong><br><br>
                Click the button to make your account an admin.
            </div>

            <form id="adminForm">
                <button type="submit" id="submitBtn">
                    Make Me Admin
                </button>

                <div class="loading" id="adminLoading">
                    <div class="spinner"></div>
                    <p>Processing...</p>
                </div>

                <div class="status" id="adminStatus"></div>
            </form>

            <button id="logoutBtn" style="margin-top: 20px; background: #6c757d;">
                Logout
            </button>
        </div>
    </div>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCSFPZBzewPT-Tmj-XocBZKAYppGbnE72A",
            authDomain: "reputationai-df869.firebaseapp.com",
            projectId: "reputationai-df869",
            storageBucket: "reputationai-df869.firebasestorage.app",
            messagingSenderId: "1055922829434",
            appId: "1:1055922829434:web:0df16c120978c4b5c363c3",
            measurementId: "G-5N3W3R9NWS"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const adminForm = document.getElementById('adminForm');
        const loginSection = document.getElementById('loginSection');
        const adminSection = document.getElementById('adminSection');
        const loginBtn = document.getElementById('loginBtn');
        const submitBtn = document.getElementById('submitBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const currentUserSpan = document.getElementById('currentUser');
        const loginLoading = document.getElementById('loginLoading');
        const adminLoading = document.getElementById('adminLoading');
        const loginStatus = document.getElementById('loginStatus');
        const adminStatus = document.getElementById('adminStatus');
        let currentUserId = null;

        // Login Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showLoginStatus('Please enter email and password', 'error');
                return;
            }

            showLoginLoading(true);
            loginBtn.disabled = true;

            try {
                showLoginStatus('Signing in...', 'info');
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                
                showLoginStatus(`✅ Welcome, ${email}!`, 'success');
                
                // Switch to admin section
                setTimeout(() => {
                    loginSection.style.display = 'none';
                    adminSection.style.display = 'block';
                    currentUserSpan.textContent = email;
                    currentUserId = userCredential.user.uid;
                }, 1000);
                
            } catch (error) {
                console.error('Full login error:', error);
                let errorMsg = error.message;
                
                // Map Firebase error codes to user-friendly messages
                if (error.code === 'auth/user-not-found') {
                    errorMsg = '❌ Email not registered. Check your email or sign up first.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMsg = '❌ Wrong password. Please try again.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = '❌ Invalid email format.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg = '❌ Too many failed attempts. Please try again later.';
                } else if (error.code === 'auth/invalid-credential') {
                    errorMsg = '❌ Invalid email or password.';
                } else {
                    errorMsg = `❌ Login failed: ${error.message} (Code: ${error.code})`;
                }
                
                showLoginStatus(errorMsg, 'error');
                console.log('Error code:', error.code);
                console.log('Full message:', error.message);
                
            } finally {
                showLoginLoading(false);
                loginBtn.disabled = false;
            }
        });

        // Make Admin Handler (self-elevate)
        adminForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!auth.currentUser || !currentUserId) {
                showAdminStatus('❌ Not logged in. Please log in first.', 'error');
                return;
            }

            const adminEmail = auth.currentUser.email?.toLowerCase();

            showAdminLoading(true);
            submitBtn.disabled = true;

            try {
                showAdminStatus('Updating your account...', 'info');

                // Create or update your user doc with your UID as the document ID
                await db.collection('users').doc(currentUserId).set({
                    email: adminEmail,
                    role: 'admin',
                    is_active: true,
                    updated_at: new Date(),
                    permissions: {
                        canManageUsers: true,
                        canManageApplications: true,
                        canViewAnalytics: true,
                        canExportData: true
                    }
                }, { merge: true });

                showAdminStatus(`✅ SUCCESS! ${adminEmail} is now an ADMIN! 🎉\n\nLogout and login again to see admin features.`, 'success');

            } catch (error) {
                console.error('Error:', error);
                showAdminStatus(`❌ Error: ${error.message}`, 'error');
            } finally {
                showAdminLoading(false);
                submitBtn.disabled = false;
            }
        });

        // Logout Handler
        logoutBtn.addEventListener('click', async () => {
            try {
                await auth.signOut();
                loginSection.style.display = 'block';
                adminSection.style.display = 'none';
                loginForm.reset();
                adminForm.reset();
                showLoginStatus('', '');
                showAdminStatus('', '');
            } catch (error) {
                console.error('Logout error:', error);
            }
        });

        function showLoginStatus(message, type) {
            loginStatus.textContent = message;
            loginStatus.className = `status ${type}`;
        }

        function showAdminStatus(message, type) {
            adminStatus.textContent = message;
            adminStatus.className = `status ${type}`;
        }

        function showLoginLoading(show) {
            loginLoading.style.display = show ? 'block' : 'none';
        }

        function showAdminLoading(show) {
            adminLoading.style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
