<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form - ReputationAI</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
        <nav class="nav-premium" role="navigation" aria-label="Main navigation">
            <div class="nav-wrapper">
                <a href="../index.html" class="brand" aria-label="ReputationAI Home">
                    <svg class="brand-icon" width="36" height="36" viewBox="0 0 36 36" fill="none" role="img" aria-label="ReputationAI Logo">
                        <rect width="36" height="36" rx="8" fill="#0a0a0f" stroke="url(#logoStroke)" stroke-width="1.5"/>
                        <text x="18" y="25" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="url(#logoText)" text-anchor="middle">RA</text>
                        <defs>
                            <linearGradient id="logoStroke" x1="0" y1="0" x2="36" y2="36">
                                <stop offset="0%" stop-color="#6366f1"/>
                                <stop offset="100%" stop-color="#8b5cf6"/>
                            </linearGradient>
                            <linearGradient id="logoText" x1="0" y1="0" x2="36" y2="36">
                                <stop offset="0%" stop-color="#6366f1"/>
                                <stop offset="100%" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="brand-name">ReputationAI</span>
                </a>
                <div class="nav-links">
                    <a href="../protection.html">Features</a>
                    <a href="../protection.html#how-it-works">Protection</a>
                    <a href="../cost-of-nothing.html">Enterprise</a>
                    <a href="application-form.html">Get Protected</a>
                    <a href="index.html" class="nav-link-dash">Dashboard</a>
                </div>
                <button class="mobile-nav-toggle" onclick="toggleMobileNav()" aria-label="Toggle navigation menu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </nav>
    <nav class="nav-premium">
        <div class="nav-wrapper">
            <a href="/" class="brand">ReputationAI</a>
        </div>
    </nav>
    <main>
        <section class="application-form-section">
            <h1>Get Protected: Application Form</h1>
            <form class="application-form">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
                <label for="company">Company (optional):</label>
                <input type="text" id="company" name="company">
                <label for="details">Protection Needs:</label>
                <textarea id="details" name="details" rows="4" required></textarea>
                <button type="submit" class="btn-hero-primary">Submit Application</button>
            </form>
        </section>
    </main>
</body>
</html>
